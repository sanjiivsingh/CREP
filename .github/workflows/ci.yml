name: CREP CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "test/**"
      - "docs/**"
      - "chore/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  test:
    name: Test CREP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set executable permissions
        shell: bash
        run: |
          chmod +x bin/crep
          chmod +x tests/*.sh
          chmod +x install.sh
          chmod +x uninstall.sh

      - name: Show environment
        shell: bash
        run: |
          echo "========================================"
          echo "CREP CI Environment"
          echo "========================================"
          echo "Runner OS: $RUNNER_OS"
          echo "OS: $(uname -s)"
          echo "Architecture: $(uname -m)"
          echo
          echo "Bash:"
          bash --version | head -n 1
          echo
          echo "Git:"
          git --version
          echo "========================================"

      - name: Run test suite
        shell: bash
        run: |
          ./tests/test_runner.sh

      - name: CLI version smoke test
        shell: bash
        run: |
          ./bin/crep --version

      - name: CLI help smoke test
        shell: bash
        run: |
          ./bin/crep --help


  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        shell: bash
        run: |
          shellcheck -x \
            tests/*.sh \
            install.sh \
            uninstall.sh